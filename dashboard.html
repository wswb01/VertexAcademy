<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Vertex Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .course-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid var(--gray-light);
        }
        .course-card h3 {
            color: var(--dark-color);
            margin-bottom: 10px;
        }
        .status-badge {
            display: inline-block;
            background: #2ed573;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--gray-light);
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary-color);
            border-radius: 6px;
            transition: width 0.3s;
        }
        .continue-btn {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="logo">
                    <a href="index.html">
                        <span class="logo-icon"><i class="fas fa-cube"></i></span>
                        <span class="logo-text">Vertex<span class="logo-accent">Academy</span></span>
                    </a>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="courses.html">Курсы</a></li>
                    <li><a href="dashboard.html" class="active">Кабинет</a></li>
                    <li><a href="#" id="logoutBtn" class="btn btn-outline">Выйти</a></li>
                </ul>
                <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
            </nav>
        </div>
    </header>

    <main style="margin-top: 120px; padding: 0 20px 60px;">
        <div class="container">
            <h2>👤 Личный кабинет</h2>
            <div id="userInfo" style="background: var(--light-color); padding: 20px; border-radius: 16px; margin-bottom: 30px;"></div>
            
            <h3>📚 Мои курсы</h3>
            <div id="myCourses"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p class="copyright">&copy; 2025 Vertex Academy. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="js/database.js"></script>
    <script>
        let currentUser = null;
        
        async function logout() {
            sessionStorage.removeItem('userId');
            window.location.href = 'index.html';
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            await openDB();
            
            const userId = sessionStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }
            
            // Загружаем пользователя из БД
            const users = await getAllUsers();
            currentUser = users.find(u => u.id == parseInt(userId));
            
            if (!currentUser) {
                sessionStorage.removeItem('userId');
                window.location.href = 'login.html';
                return;
            }
            
            // Отображаем информацию о пользователе
            const userInfoDiv = document.getElementById('userInfo');
            userInfoDiv.innerHTML = `
                <p><strong>👋 Привет, ${escapeHtml(currentUser.name || currentUser.email)}!</strong></p>
                <p>📧 ${escapeHtml(currentUser.email)}</p>
                <p>🎓 Роль: ${currentUser.role === 'admin' ? 'Администратор' : 'Студент'}</p>
                <p>📅 Зарегистрирован: ${new Date(currentUser.createdAt).toLocaleDateString('ru-RU')}</p>
            `;
            
            // Загружаем записи пользователя
            const enrollments = await getEnrollmentsByUser(currentUser.id);
            const allCourses = await getAllCourses();
            
            // Фильтруем курсы, на которые записан пользователь
            const myCourses = allCourses.filter(c => enrollments.some(e => e.courseId === c.id));
            
            const container = document.getElementById('myCourses');
            
            if (myCourses.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; background: var(--light-color); border-radius: 16px;">
                        <p>📭 Вы ещё не записаны ни на один курс.</p>
                        <a href="courses.html" class="btn btn-primary" style="margin-top: 15px;">Перейти к курсам</a>
                    </div>
                `;
            } else {
                // Для каждого курса получаем прогресс
                let coursesHtml = '';
                for (const course of myCourses) {
                    // ПОЛУЧАЕМ ПРОГРЕСС (вот это место - самое важное!)
                    const progress = await getUserProgressForCourse(currentUser.id, course.id);
                    
                    coursesHtml += `
                        <div class="course-card">
                            <h3>${escapeHtml(course.title)}</h3>
                            <p>${escapeHtml(course.description)}</p>
                            
                            <!-- Прогресс-бар -->
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress.percent}%;"></div>
                            </div>
                            <p>📊 Прогресс: ${progress.percent}% (${progress.completed}/${progress.total} уроков)</p>
                            
                            <p>⏱ Длительность: ${course.duration}</p>
                            <p>💰 ${course.price === 0 ? 'Бесплатно' : course.price + ' ₽'}</p>
                            
                            ${progress.percent === 100 
                                ? '<span class="status-badge" style="background:#2ed573;">✅ Завершён</span>'
                                : '<span class="status-badge">🟢 В процессе обучения</span>'
                            }
                            
                            <div style="margin-top: 15px;">
                                <a href="learn.html?courseId=${course.id}" class="btn btn-primary continue-btn">
                                    ${progress.percent === 0 ? '🚀 Начать обучение' : '📖 Продолжить обучение'}
                                </a>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = coursesHtml;
            }
            
            // Кнопка выхода
            document.getElementById('logoutBtn').addEventListener('click', logout);
            
            // Мобильное меню
            document.getElementById('navToggle')?.addEventListener('click', () => {
                document.querySelector('.nav-menu').classList.toggle('active');
            });
        });
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
